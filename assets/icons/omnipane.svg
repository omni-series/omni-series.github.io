<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- キャプチャの質感を忠実に再現したソフトグラデーション -->
    <linearGradient id="fluentBlueGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#0e79ff" />
      <stop offset="45%" stop-color="#0066f5" />
      <stop offset="100%" stop-color="#004ed0" />
    </linearGradient>
  </defs>

  <!-- 
    OmniPaneExplorer Clean Vector (with Subtle Gradient)
    - グラデーション: 左上(#0e79ff) 〜 右下(#004ed0)
    - スリット（道路）幅: 40px
    - コーナー部: 同心フィレットRによる滑らかな連続接続
    - 十字分割溝幅: 40px
  -->
  <g fill="url(#fluentBlueGrad)">
    <!-- ============================================================
         1. 左上ペイン: 上部タブ部分
         ============================================================ -->
    <path d="M 20 220
             L 91.72 131.72
             A 40 40 0 0 1 120 120
             L 480 120
             L 480 66
             C 425 66 385 45 352 18
             C 334 5 315 0 285 0
             L 200 0
             A 180 180 0 0 0 20 180
             Z" />

    <!-- ============================================================
         2. 左上ペイン: 下部本体部分
         ============================================================ -->
    <path d="M 20 276.57
             L 111.51 168.49
             A 12 12 0 0 1 120 160
             L 480 160
             L 480 480
             L 20 480
             Z" />

    <!-- ============================================================
         3. 右上ペイン (十字溝幅: 40px -> X: 520〜, Y: 480まで)
         ============================================================ -->
    <path d="M 520 66
             L 820 66
             A 180 180 0 0 1 1000 246
             L 1000 480
             L 520 480
             Z" />

    <!-- ============================================================
         4. 左下ペイン (十字溝幅: 40px -> Y: 520〜, X: 〜480)
         ============================================================ -->
    <path d="M 20 520
             L 480 520
             L 480 1000
             L 200 1000
             A 180 180 0 0 1 20 820
             Z" />

    <!-- ============================================================
         5. 右下ペイン (十字溝幅: 40px -> X: 520〜, Y: 520〜)
         ============================================================ -->
    <path d="M 520 520
             L 1000 520
             L 1000 820
             A 180 180 0 0 1 820 1000
             L 520 1000
             Z" />
  </g>
</svg>
