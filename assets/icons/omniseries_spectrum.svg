<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- 4-Pane Spectrum Gradients -->
    <!-- Top-Left: Fluent Royal Blue -->
    <linearGradient id="gradTopLeft" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#0c77fe" />
      <stop offset="50%" stop-color="#076df6" />
      <stop offset="100%" stop-color="#0766eb" />
    </linearGradient>

    <!-- Top-Right: Electric Cyan / Aqua -->
    <linearGradient id="gradTopRight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#02bcfc" />
      <stop offset="50%" stop-color="#00b7f7" />
      <stop offset="100%" stop-color="#00b4f3" />
    </linearGradient>

    <!-- Bottom-Left: Violet / Indigo Blue -->
    <linearGradient id="gradBottomLeft" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#5066f8" />
      <stop offset="50%" stop-color="#4d61f6" />
      <stop offset="100%" stop-color="#4c5bed" />
    </linearGradient>

    <!-- Bottom-Right: Magenta / Orchid Purple -->
    <linearGradient id="gradBottomRight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#9a499a" />
      <stop offset="50%" stop-color="#974698" />
      <stop offset="100%" stop-color="#954395" />
    </linearGradient>

    <!-- ============================================================
         黄色系の濃淡グラデーション（リアルな発光・レンズフレア）
         ============================================================ -->
    <!-- 1. メイン光輪グロー (中心白 -> レモン黄 -> アンバーゴールド -> 透明) -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="22%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="48%" stop-color="#fde047" stop-opacity="0.8" />
      <stop offset="72%" stop-color="#eab308" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- 2. 広域ソフトフレア (外周アンビエント光) -->
    <radialGradient id="outerFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <!-- 3. 水平光芒グラデーション -->
    <linearGradient id="rayH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#fde047" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>

    <!-- 4. 垂直光芒グラデーション -->
    <linearGradient id="rayV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0" />
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="65%" stop-color="#fde047" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ============================================================
       Omni Series Spectrum 4-Pane
       ============================================================ -->
  <g id="omni-spectrum-panes">
    <!-- 1. 左上ペイン: 上部タブ部分 -->
    <path fill="url(#gradTopLeft)"
          d="M 20 220
             L 91.72 131.72
             A 40 40 0 0 1 120 120
             L 480 120
             L 480 66
             C 425 66 385 45 352 18
             C 334 5 315 0 285 0
             L 200 0
             A 180 180 0 0 0 20 180
             Z" />

    <!-- 2. 左上ペイン: 下部本体部分 -->
    <path fill="url(#gradTopLeft)"
          d="M 20 276.57
             L 111.51 168.49
             A 12 12 0 0 1 120 160
             L 480 160
             L 480 480
             L 20 480
             Z" />

    <!-- 3. 右上ペイン (十字溝幅: 40px -> X: 520〜, Y: 480まで) -->
    <path fill="url(#gradTopRight)"
          d="M 520 66
             L 820 66
             A 180 180 0 0 1 1000 246
             L 1000 480
             L 520 480
             Z" />

    <!-- 4. 左下ペイン (十字溝幅: 40px -> Y: 520〜, X: 〜480) -->
    <path fill="url(#gradBottomLeft)"
          d="M 20 520
             L 480 520
             L 480 1000
             L 200 1000
             A 180 180 0 0 1 20 820
             Z" />

    <!-- 5. 右下ペイン (十字溝幅: 40px -> X: 520〜, Y: 520〜) -->
    <path fill="url(#gradBottomRight)"
          d="M 520 520
             L 1000 520
             L 1000 820
             A 180 180 0 0 1 820 1000
             L 520 1000
             Z" />
  </g>

  <!-- ============================================================
       中央の光（黄色系の濃淡・レンズフレア）
       中心座標: (500, 500)
       ============================================================ -->
  <g id="center-light" transform="translate(500, 500)">
    <!-- 1. 広域アンビエント光 (r=300) -->
    <circle r="300" fill="url(#outerFlare)" />

    <!-- 2. メイン光輪グロー (r=180) -->
    <circle r="180" fill="url(#sunGlow)" />

    <!-- 3. 十字の光芒（ダイヤモンド・スターバースト形状） -->
    <!-- 水平光条 (幅 760px, 中心厚み 36px) -->
    <path d="M -380 0 Q 0 -18 380 0 Q 0 18 -380 0 Z" fill="url(#rayH)" />
    <!-- 垂直光条 (高さ 760px, 中心厚み 36px) -->
    <path d="M 0 -380 Q -18 0 0 380 Q 18 0 0 -380 Z" fill="url(#rayV)" />

    <!-- 4. 鋭い高輝度光線（中心ライン） -->
    <line x1="-340" y1="0" x2="340" y2="0" stroke="url(#rayH)" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="-340" x2="0" y2="340" stroke="url(#rayV)" stroke-width="4" stroke-linecap="round" />

    <!-- 5. 45度斜めの微細きらめき光芒 -->
    <g transform="rotate(45)" opacity="0.65">
      <path d="M -150 0 Q 0 -8 150 0 Q 0 8 -150 0 Z" fill="url(#rayH)" />
      <path d="M 0 -150 Q -8 0 0 150 Q 8 0 0 -150 Z" fill="url(#rayV)" />
    </g>

    <!-- 6. 中心強光コア（純白熱光 ＆ レモンイエローオーラ） -->
    <circle r="65" fill="#fef08a" fill-opacity="0.75" />
    <circle r="38" fill="#ffffff" fill-opacity="0.95" />
  </g>
</svg>
